<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勾配 寸法計算 (Mac版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
    <link rel="apple-touch-icon" href="./icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#121214">
    <style>
        /* Apple Dark Mode Base Styling */
        body {
            background-color: #121214;
            color: #f5f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* カスタムスクロールバー */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1c1c1e;
        }
        ::-webkit-scrollbar-thumb {
            background: #3a3a3c;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #48484a;
        }

        /* 数値入力スピンボタンの非表示化 */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        /* テーブル線定義 */
        .result-table th, .result-table td {
            border: 1px solid #2c2c2e;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 md:p-6 lg:p-8">

    <!-- ヘッダー -->
    <header class="max-w-[1600px] w-full mx-auto flex items-center justify-between pb-4 mb-4 border-b border-[#2c2c2e]">
        <div class="flex items-center gap-3">
            <div class="w-3.5 h-3.5 rounded-full bg-[#ff5f56]"></div>
            <div class="w-3.5 h-3.5 rounded-full bg-[#ffbd2e]"></div>
            <div class="w-3.5 h-3.5 rounded-full bg-[#27c93f]"></div>
            <h1 class="text-xl md:text-2xl font-bold tracking-tight text-white ml-2">勾配 寸法計算</h1>
            <span class="text-xs font-semibold px-2 py-0.5 rounded bg-[#2c2c2e] text-[#8e8e93]">for Mac</span>
        </div>
        <div class="flex items-center gap-3">
            <span class="text-xs font-bold tracking-wider text-[#8e8e93]">KYOWA ROOF</span>
            <button id="btnShare" type="button" onclick="shareOrCopyData()" class="px-4 py-2 bg-[#0a84ff] hover:bg-[#0071e3] text-white text-sm font-semibold rounded-lg shadow-sm transition-all flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                結果をコピー
            </button>
            <button id="btnResetAll" type="button" onclick="resetAllInputs()" class="px-3 py-2 bg-[#2c2c2e] hover:bg-[#3a3a3c] text-[#ff453a] text-sm font-semibold rounded-lg transition-all">
                全クリア
            </button>
        </div>
    </header>

    <!-- メインコンテンツ (左右2カラム構成) -->
    <main class="max-w-[1600px] w-full mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1 items-start">
        
        <!-- 左カラム：入力欄 + 計算結果サマリー + 図面描画 -->
        <section class="lg:col-span-7 flex flex-col gap-6">
            
            <!-- 入力カード (Macキーボード入力専用) -->
            <div class="bg-[#1c1c1e] border border-[#2c2c2e] rounded-xl p-5 shadow-lg">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-sm font-semibold text-[#8e8e93] uppercase tracking-wide">設計寸法 入力 (キーボード対応)</h2>
                    <span class="text-xs text-[#8e8e93]">Tabキーで次の項目へ移動 / 入力時に即時計算</span>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- 基準側 L1 -->
                    <div class="bg-[#121214] border border-[#2c2c2e] rounded-lg p-3 focus-within:border-[#30d158] focus-within:ring-1 focus-within:ring-[#30d158] transition-all">
                        <div class="flex justify-between items-center mb-1">
                            <label for="input-L1" class="text-xs font-bold text-[#30d158]">基準側 L1 (mm)</label>
                            <button type="button" onclick="clearField('L1')" class="text-[11px] text-[#636366] hover:text-[#aeaeb2]">クリア</button>
                        </div>
                        <input type="number" id="input-L1" step="any" min="0" placeholder="0" class="w-full bg-transparent text-2xl font-bold text-white text-right focus:outline-none" oninput="handleInputChange()">
                    </div>

                    <!-- 延長側 L2 -->
                    <div class="bg-[#121214] border border-[#2c2c2e] rounded-lg p-3 focus-within:border-[#30d158] focus-within:ring-1 focus-within:ring-[#30d158] transition-all">
                        <div class="flex justify-between items-center mb-1">
                            <label for="input-L2" class="text-xs font-bold text-[#30d158]">延長側 L2 (mm)</label>
                            <button type="button" onclick="clearField('L2')" class="text-[11px] text-[#636366] hover:text-[#aeaeb2]">クリア</button>
                        </div>
                        <input type="number" id="input-L2" step="any" min="0" placeholder="0" class="w-full bg-transparent text-2xl font-bold text-white text-right focus:outline-none" oninput="handleInputChange()">
                    </div>

                    <!-- 全体の幅 W -->
                    <div class="bg-[#121214] border border-[#2c2c2e] rounded-lg p-3 focus-within:border-[#0a84ff] focus-within:ring-1 focus-within:ring-[#0a84ff] transition-all">
                        <div class="flex justify-between items-center mb-1">
                            <label for="input-W" class="text-xs font-bold text-[#0a84ff]">全体の幅 W (mm)</label>
                            <button type="button" onclick="clearField('W')" class="text-[11px] text-[#636366] hover:text-[#aeaeb2]">クリア</button>
                        </div>
                        <input type="number" id="input-W" step="any" min="0" placeholder="0" class="w-full bg-transparent text-2xl font-bold text-white text-right focus:outline-none" oninput="handleInputChange()">
                    </div>

                    <!-- 働き幅 ＠ -->
                    <div class="bg-[#121214] border border-[#2c2c2e] rounded-lg p-3 focus-within:border-[#bf5af2] focus-within:ring-1 focus-within:ring-[#bf5af2] transition-all">
                        <div class="flex justify-between items-center mb-1">
                            <label for="input-Pitch" class="text-xs font-bold text-[#bf5af2]">働き幅 ＠ (mm)</label>
                            <button type="button" onclick="clearField('Pitch')" class="text-[11px] text-[#636366] hover:text-[#aeaeb2]">クリア</button>
                        </div>
                        <input type="number" id="input-Pitch" step="any" min="0" placeholder="0" class="w-full bg-transparent text-2xl font-bold text-white text-right focus:outline-none" oninput="handleInputChange()">
                    </div>
                </div>
            </div>

            <!-- 計算結果サマリー -->
            <div class="bg-[#1c1c1e] border border-[#2c2c2e] rounded-xl p-5 shadow-lg">
                <h2 class="text-sm font-semibold text-[#8e8e93] uppercase tracking-wide mb-3">計算結果 概要</h2>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    <div class="bg-[#121214] border border-[#2c2c2e] p-3 rounded-lg text-center">
                        <span class="block text-xs font-bold text-[#0a84ff] mb-1">延長後の幅</span>
                        <span id="resNewB" class="text-2xl font-black text-white">-</span>
                    </div>
                    <div class="bg-[#121214] border border-[#2c2c2e] p-3 rounded-lg text-center">
                        <span class="block text-xs font-bold text-[#30d158] mb-1">延長後のL2</span>
                        <span id="resNewC" class="text-2xl font-black text-white">-</span>
                    </div>
                    <div class="bg-[#121214] border border-[#2c2c2e] p-3 rounded-lg text-center">
                        <span class="block text-xs font-bold text-[#ff9f0a] mb-1">総枚数</span>
                        <span id="resIntervalCount" class="text-2xl font-black text-white">-</span>
                    </div>
                    <div class="bg-[#121214] border border-[#2c2c2e] p-3 rounded-lg text-center">
                        <span class="block text-xs font-bold text-[#bf5af2] mb-1">増分 (1枚あたり)</span>
                        <span id="resStep" class="text-2xl font-black text-white">-</span>
                    </div>
                </div>
            </div>

            <!-- 勾配断面図 Canvas -->
            <div class="bg-[#1c1c1e] border border-[#2c2c2e] rounded-xl p-5 shadow-lg flex flex-col">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-sm font-semibold text-[#8e8e93] uppercase tracking-wide">勾配 断面形状図</h2>
                    <span class="text-xs text-[#8e8e93]">クリックで拡大プレビュー</span>
                </div>
                <div class="w-full bg-[#121214] border border-[#2c2c2e] rounded-lg aspect-[16/9] overflow-hidden cursor-pointer relative" onclick="openZoomModal()">
                    <canvas id="slopeCanvas" class="w-full h-full block"></canvas>
                </div>
            </div>
        </section>

        <!-- 右カラム：寸法詳細テーブル -->
        <section class="lg:col-span-5 flex flex-col">
            <div class="bg-[#1c1c1e] border border-[#2c2c2e] rounded-xl p-5 shadow-lg flex flex-col">
                <div class="flex items-center justify-between pb-3 mb-3 border-b border-[#2c2c2e]">
                    <div class="flex items-center gap-2">
                        <h2 class="text-base font-bold text-white">各ピッチ寸法詳細</h2>
                        <span id="table-summary" class="text-sm font-bold text-[#ff9f0a] bg-[#ff9f0a]/10 px-2 py-0.5 rounded">0枚</span>
                    </div>
                    <span class="text-xs text-[#8e8e93]">単位: mm</span>
                </div>

                <!-- スクロール可能な表コンテナ -->
                <div class="overflow-y-auto max-h-[calc(100vh-280px)] rounded-lg border border-[#2c2c2e]">
                    <table class="result-table w-full border-collapse bg-[#121214] text-sm">
                        <thead class="sticky top-0 bg-[#242426] z-10">
                            <tr>
                                <th class="w-16 text-[#ff9f0a] py-2.5 font-bold">No.</th>
                                <th class="text-[#0a84ff] py-2.5 font-bold">働き幅累計</th>
                                <th class="text-[#30d158] py-2.5 font-bold">屋根長さ</th>
                            </tr>
                        </thead>
                        <tbody id="resultBody">
                            <tr>
                                <td colspan="3" class="text-center py-8 text-[#8e8e93]">数値を入力すると寸法表が表示されます</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <!-- トースト通知コンテナ (alert代替) -->
    <div id="toast" class="fixed bottom-6 right-6 bg-[#2c2c2e] text-white px-4 py-3 rounded-lg shadow-2xl border border-[#48484a] flex items-center gap-2 transform translate-y-20 opacity-0 pointer-events-none transition-all duration-300 z-50">
        <svg class="w-5 h-5 text-[#30d158]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
        <span id="toastMsg" class="text-sm font-medium">通知メッセージ</span>
    </div>

    <!-- 拡大モーダル -->
    <div id="zoomModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm p-6" onclick="closeZoomModal()">
        <div class="relative max-w-5xl w-full max-h-[90vh] bg-[#1c1c1e] border border-[#3a3a3c] rounded-2xl p-4 flex flex-col shadow-2xl" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-3">
                <span class="text-sm font-semibold text-white">拡大表示</span>
                <button type="button" onclick="closeZoomModal()" class="text-[#8e8e93] hover:text-white p-1 rounded-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="flex-1 flex items-center justify-center overflow-hidden">
                <img id="zoomImg" class="max-w-full max-h-[75vh] object-contain" alt="拡大プレビュー">
            </div>
        </div>
    </div>

    <script>
        // 入力キー一覧
        const keys = ['L1', 'L2', 'W', 'Pitch'];

        // 入力値変更ハンドラ
        function handleInputChange() {
            calculate();
            saveState();
        }

        // 個別フィールド消去
        function clearField(key) {
            const input = document.getElementById(`input-${key}`);
            if (input) {
                input.value = '';
                input.focus();
                calculate();
                saveState();
            }
        }

        // 全入力クリア
        function resetAllInputs() {
            keys.forEach(k => {
                const el = document.getElementById(`input-${k}`);
                if (el) el.value = '';
            });
            calculate();
            saveState();
            showToast('すべての入力をクリアしました');
        }

        // 入力値取得
        function getValues() {
            return {
                L1: parseFloat(document.getElementById('input-L1').value) || 0,
                L2: parseFloat(document.getElementById('input-L2').value) || 0,
                W: parseFloat(document.getElementById('input-W').value) || 0,
                Pitch: parseFloat(document.getElementById('input-Pitch').value) || 0
            };
        }

        // 計算処理本体
        function calculate() {
            const vals = getValues();
            const a = vals.L1;
            const b = vals.W;
            const c = vals.L2;
            const interval = vals.Pitch;

            const resNewB = document.getElementById('resNewB');
            const resNewC = document.getElementById('resNewC');
            const resIntervalCount = document.getElementById('resIntervalCount');
            const resStep = document.getElementById('resStep');
            const tableSummary = document.getElementById('table-summary');
            const tbody = document.getElementById('resultBody');

            // 必要最低限の入力がない場合
            if (b <= 0 || interval <= 0) {
                resNewB.innerText = '-';
                resNewC.innerText = '-';
                resIntervalCount.innerText = '-';
                resStep.innerText = '-';
                tableSummary.innerText = '0枚';
                tbody.innerHTML = '<tr><td colspan="3" class="text-center py-8 text-[#8e8e93]">数値を入力すると寸法表が表示されます</td></tr>';
                clearCanvas();
                return;
            }

            const count = Math.ceil(b / interval);
            const newB = count * interval;
            const slope = (c - a) / b;
            const newC = a + (slope * newB);
            const step = slope * interval;

            resNewB.innerText = Math.round(newB).toLocaleString();
            resNewC.innerText = Math.round(newC).toLocaleString();
            resIntervalCount.innerText = `${count}枚`;
            resStep.innerText = Math.round(Math.abs(step)).toLocaleString();
            tableSummary.innerText = `${count}枚`;

            // 寸法テーブル生成
            let tableHtml = '';
            for (let i = 0; i <= count; i++) {
                const dist = i * interval;
                const height = a + (slope * dist);
                const isStart = (i === 0);
                const distColor = isStart ? "text-[#8e8e93]" : "text-[#0a84ff]";
                const heightColor = isStart ? "text-[#8e8e93]" : "text-[#30d158]";

                tableHtml += `
                    <tr class="hover:bg-[#1f1f22] transition-colors">
                        <td class="text-center font-bold text-[#ff9f0a] py-2.5">${i}</td>
                        <td class="text-center font-semibold ${distColor} py-2.5">${Math.round(dist).toLocaleString()}</td>
                        <td class="text-center font-extrabold text-lg ${heightColor} py-2.5">${Math.round(height).toLocaleString()}</td>
                    </tr>
                `;
            }

            // 端材の算出
            const scrapW = newB - b;
            const scrapL = newC - c;
            tableHtml += `
                <tr class="bg-[#242426]">
                    <td class="text-center font-bold text-[#aeaeb2] py-2.5 text-xs">端材</td>
                    <td class="text-center text-[#0a84ff] py-2.5">
                        <span class="text-[11px] text-[#8e8e93] block">働き端材</span>
                        <span class="font-bold">${Math.round(scrapW).toLocaleString()}</span>
                    </td>
                    <td class="text-center text-[#30d158] py-2.5">
                        <span class="text-[11px] text-[#8e8e93] block">長さ端材</span>
                        <span class="font-extrabold text-lg">${Math.round(scrapL).toLocaleString()}</span>
                    </td>
                </tr>
            `;

            tbody.innerHTML = tableHtml;
            drawSlope(a, b, c, newB, newC, count, interval);
        }

        // Canvasクリア
        function clearCanvas() {
            const canvas = document.getElementById('slopeCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // 勾配図面の描画
        function drawSlope(a, origB, origC, newB, newC, count, interval) {
            const canvas = document.getElementById('slopeCanvas');
            if (!canvas) return;
            const container = canvas.parentElement;
            const dpr = window.devicePixelRatio || 1;
            const rect = container.getBoundingClientRect();

            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);
            ctx.clearRect(0, 0, rect.width, rect.height);

            const padding = { l: 45, r: 45, t: 35, b: 45 };
            const drawW = rect.width - (padding.l + padding.r);
            const drawH = rect.height - (padding.t + padding.b);
            const scaleX = drawW / (newB || 1);
            const maxHeight = Math.max(a, newC, origC);
            const scaleY = drawH / (maxHeight || 1);

            const tx = (x) => padding.l + x * scaleX;
            const ty = (y) => rect.height - padding.b - y * scaleY;

            // 背景グリッド
            ctx.beginPath();
            ctx.strokeStyle = '#222226';
            ctx.lineWidth = 1;
            for (let j = 0; j <= maxHeight; j += (maxHeight / 4 || 1)) {
                if (j === 0) continue;
                ctx.moveTo(tx(0), ty(j));
                ctx.lineTo(tx(newB), ty(j));
            }
            ctx.stroke();

            // 底辺
            ctx.beginPath();
            ctx.strokeStyle = '#0a84ff';
            ctx.lineWidth = 2;
            ctx.moveTo(tx(0), ty(0));
            ctx.lineTo(tx(newB), ty(0));
            ctx.stroke();

            // 各ピッチ線 (働き幅ごとの立ち上がり)
            for (let i = 1; i < count; i++) {
                const cx = i * interval;
                const cy = a + ((newC - a) / newB) * cx;
                ctx.beginPath();
                ctx.strokeStyle = '#bf5af2';
                ctx.lineWidth = 1;
                ctx.globalAlpha = 0.4;
                ctx.moveTo(tx(cx), ty(0));
                ctx.lineTo(tx(cx), ty(cy));
                ctx.stroke();
                ctx.globalAlpha = 1.0;
            }

            // 元寸法のライン（破線）
            if (origB > 0 && origB !== newB) {
                ctx.setLineDash([4, 3]);
                ctx.strokeStyle = '#ff453a';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(tx(origB), ty(0));
                ctx.lineTo(tx(origB), ty(origC));
                ctx.stroke();
                ctx.setLineDash([]);

                ctx.font = "bold 11px -apple-system, sans-serif";
                ctx.fillStyle = "#ff453a";
                ctx.textAlign = "center";
                ctx.fillText(`実寸L2: ${Math.round(origC)}`, tx(origB), ty(0) + 18);
            }

            // 基準側(L1)・延長側(L2)の垂直線
            ctx.beginPath();
            ctx.strokeStyle = '#30d158';
            ctx.lineWidth = 2.5;
            ctx.moveTo(tx(0), ty(0));
            ctx.lineTo(tx(0), ty(a));
            ctx.stroke();

            ctx.beginPath();
            ctx.strokeStyle = '#30d158';
            ctx.lineWidth = 2.5;
            ctx.moveTo(tx(newB), ty(0));
            ctx.lineTo(tx(newB), ty(newC));
            ctx.stroke();

            // 斜辺 (屋根勾配面)
            ctx.beginPath();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2.5;
            ctx.moveTo(tx(0), ty(a));
            ctx.lineTo(tx(newB), ty(newC));
            ctx.stroke();

            // 数値ラベル描画
            ctx.font = "bold 12px -apple-system, sans-serif";
            ctx.fillStyle = "#30d158";
            ctx.textAlign = "center";
            ctx.fillText(`L1: ${Math.round(a)}`, tx(0), ty(a) - 10);
            ctx.fillText(`延長L2: ${Math.round(newC)}`, tx(newB), ty(newC) - 10);

            ctx.fillStyle = "#0a84ff";
            ctx.fillText(`W(設計): ${Math.round(origB)}`, tx(origB / 2), ty(0) + 18);

            if (origB !== newB && newB > 0) {
                ctx.fillStyle = "#8e8e93";
                ctx.font = "11px -apple-system, sans-serif";
                ctx.fillText(`全体幅: ${Math.round(newB)} (端材 ${Math.round(newB - origB)})`, tx(newB / 2), ty(0) + 32);
            }
        }

        // LocalStorageへの状態保存
        function saveState() {
            const vals = {
                L1: document.getElementById('input-L1').value,
                L2: document.getElementById('input-L2').value,
                W: document.getElementById('input-W').value,
                Pitch: document.getElementById('input-Pitch').value
            };
            localStorage.setItem('slope_calc_mac_state', JSON.stringify(vals));
        }

        // 状態の復帰
        function loadState() {
            const saved = localStorage.getItem('slope_calc_mac_state');
            if (saved) {
                try {
                    const vals = JSON.parse(saved);
                    keys.forEach(k => {
                        if (vals[k] !== undefined) {
                            document.getElementById(`input-${k}`).value = vals[k];
                        }
                    });
                } catch (e) {
                    console.error(e);
                }
            }
        }

        // モーダル表示切り替え
        function openZoomModal() {
            const canvas = document.getElementById('slopeCanvas');
            if (!canvas || canvas.width === 0) return;
            const zoomImg = document.getElementById('zoomImg');
            zoomImg.src = canvas.toDataURL('image/png');
            document.getElementById('zoomModal').classList.remove('hidden');
        }

        function closeZoomModal() {
            document.getElementById('zoomModal').classList.add('hidden');
        }

        // トースト通知表示 (alert不使用)
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.innerText = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        // コピー用テキスト生成
        function buildShareText() {
            const vals = getValues();
            const resNewB = document.getElementById('resNewB').innerText;
            const resNewC = document.getElementById('resNewC').innerText;
            const resIntervalCount = document.getElementById('resIntervalCount').innerText;
            const resStep = document.getElementById('resStep').innerText;

            const lines = [
                '【勾配 寸法計算結果】',
                `基準側 L1: ${vals.L1} mm`,
                `延長側 L2: ${vals.L2} mm`,
                `全体の幅 W: ${vals.W} mm`,
                `働き幅 ＠: ${vals.Pitch} mm`,
                '------------------------',
                `延長後の幅: ${resNewB} mm`,
                `延長後のL2: ${resNewC} mm`,
                `総枚数: ${resIntervalCount}`,
                `増分: ${resStep} mm`,
                '------------------------',
                '【寸法詳細】'
            ];

            const rows = Array.from(document.querySelectorAll('#resultBody tr'));
            rows.forEach(r => {
                const tds = Array.from(r.querySelectorAll('td')).map(td => td.innerText.replace(/\s+/g, ' ').trim());
                if (tds.length >= 3) {
                    lines.push(`${tds[0]} | 働き幅: ${tds[1]} | 長さ: ${tds[2]}`);
                }
            });

            return lines.join('
');
        }

        // クリップボードコピー処理 (Macブラウザ対応)
        async function shareOrCopyData() {
            const text = buildShareText();

            // document.execCommand('copy') による確実なフォールバック
            const fallbackCopy = (str) => {
                const el = document.createElement('textarea');
                el.value = str;
                el.style.position = 'fixed';
                el.style.left = '-9999px';
                document.body.appendChild(el);
                el.select();
                try {
                    document.execCommand('copy');
                    showToast('計算結果をクリップボードにコピーしました');
                } catch (e) {
                    showToast('コピーに失敗しました');
                }
                document.body.removeChild(el);
            };

            if (navigator.clipboard && navigator.clipboard.writeText) {
                try {
                    await navigator.clipboard.writeText(text);
                    showToast('計算結果をクリップボードにコピーしました');
                } catch (err) {
                    fallbackCopy(text);
                }
            } else {
                fallbackCopy(text);
            }
        }

        // 初期化
        window.addEventListener('DOMContentLoaded', () => {
            loadState();
            calculate();

            // Escキーでモーダルを閉じる
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeZoomModal();
                }
            });

            // ウィンドウリサイズ時に再描画
            window.addEventListener('resize', calculate);
        });

        // Service Workerの登録
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then((registration) => {
                    console.log('ServiceWorker registration successful with scope: ', registration.scope);
                }, (err) => {
                    console.log('ServiceWorker registration failed: ', err);
                });
            });
        }
    </script>
</body>
</html>
